        /* ===========================================================
           BRIEF CSS GỐC - GIỮ Y FILE HTML GỐC
           - Đổi màu nhanh: sửa :root
           - Font đã thêm subset vietnamese để fix dấu
           - Tất cả hiệu ứng chỉ transform+opacity
        =========================================================== */
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap&subset=vietnamese');
        :root{
          --ink:#24211e; /* BRIEF: màu chữ chính, đổi ở đây sẽ đổi toàn trang */
          --muted:#706b65; /* BRIEF: chữ phụ, eyebrow */
          --paper:#f3efe7; /* BRIEF: nền chính */
          --paper2:#e9e1d5; /* BRIEF: nền phụ cho trang con */
          --wine:#5c2630; /* BRIEF: màu rượu - pullquote, accent */
          --wine2:#7c4650;
          --champ:#b79a6d; /* BRIEF: brass - progress top + line */
          --line:rgba(36,33,30,.14); /* BRIEF: viền mỏng */
          --white:#fbf9f4; /* BRIEF: nền card */
          --shadow:0 30px 80px rgba(45,34,25,.12);
          --ease:cubic-bezier(.22,1,.36,1); /* BRIEF: ease chung */
        }
        *{box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;line-height:1.65;overflow-x:hidden}
        /* BRIEF: vân giấy grain cố định, không đổi */
        body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;z-index:1;background-image:radial-gradient(rgba(36,33,30,.18) .55px,transparent .55px);background-size:6px 6px;mix-blend-mode:multiply}
        a{color:inherit;text-decoration:none}
        .wrap{max-width:1440px;margin:auto;padding:0 5.2vw;position:relative;z-index:2}
        .eyebrow{font:700 10px/1 'DM Sans';letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
        .serif{font-family:'Playfair Display',serif}
        .display{font:800 clamp(52px,9vw,138px)/.84 'Manrope';letter-spacing:-.07em}
        .section{padding:130px 0;border-top:1px solid var(--line);position:relative;z-index:2}
        .small{font-size:13px;color:var(--muted)}

        /* ── 1) PROGRESS TOP BRASS ── BRIEF: thanh 2px trên cùng, đổi màu ở đây */
        .progress-top{position:fixed;top:0;left:0;right:0;height:2px;z-index:120;transform-origin:left;pointer-events:none}
        .progress-top-inner{height:100%;background:var(--champ);transform:scaleX(0);transform-origin:left;transition:transform .08s linear;will-change:transform}

        /* ── 2) HEADER + MENU BTN ── BRIEF: nút Menu mở drawer, sửa text trong JSX */
        header{position:fixed;top:0;left:0;right:0;z-index:60;padding:18px 0;background:linear-gradient(to bottom,rgba(243,239,231,.96),rgba(243,239,231,0));backdrop-filter:blur(12px)}
        nav{display:flex;justify-content:space-between;align-items:center}
        .brand{font:800 13px/1 'Manrope';letter-spacing:.16em}
        .menu-btn{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:9px 16px;font:700 10px/1 'DM Sans';letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;gap:10px;cursor:pointer;transition:border-color .4s var(--ease),background .4s}
        .menu-btn:hover{border-color:var(--ink)}
        .menu-btn i{display:block;width:14px;height:10px;position:relative}
        .menu-btn i:before,.menu-btn i:after,.menu-btn i span{content:"";position:absolute;left:0;right:0;height:1.5px;background:var(--ink);transition:.5s var(--ease)}
        .menu-btn i:before{top:0}.menu-btn i span{top:4.2px}.menu-btn i:after{top:8.5px}
        .menu-btn.open i:before{transform:translateY(4.2px) rotate(45deg)}
        .menu-btn.open i:after{transform:translateY(-4.2px) rotate(-45deg)}
        .menu-btn.open i span{opacity:0}

        /* ── 3) HERO + CARD VISIT ĐỘNG ── */
        .hero{min-height:92vh;display:grid;align-items:end;padding:150px 0 70px;position:relative;overflow:hidden;z-index:2}
        .hero:after{content:"";position:absolute;width:52vw;height:52vw;border-radius:50%;right:-18vw;top:2vh;background:radial-gradient(circle,rgba(124,70,80,.14),transparent 65%);filter:blur(14px);pointer-events:none}
        .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:5vw;align-items:end;position:relative;z-index:2}
        .hero-kicker{margin-bottom:28px}
        .hero h1{margin:0;max-width:980px}
        .hero h1 em{font-family:'Playfair Display';font-weight:500;color:var(--wine);letter-spacing:-.04em}
        .hero-intro{max-width:480px;font-size:16px;line-height:1.85;color:#4d4842}
        .hero-line{width:90px;height:1px;background:var(--champ);margin:28px 0}
        .scroll-note{margin-top:44px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

        /* ── CARD VISIT - BRIEF CHI TIẾT ĐỂ SỬA ──
           .card-sticky: sticky top 120px, đổi top nếu header cao hơn
           .card-scene: perspective 1200px, max 12deg tilt
           .card-float: animation 5s translateY -8px infinite
           .card-inner: preserve-3d, flip 0.9s cubic, cursor pointer
           .card-face: background var(--white), border 1px var(--line), rounded 28px, shadow
           Sửa nội dung: tìm JSX CARD VISIT bên dưới
        */
        .card-sticky{position:sticky;top:120px}
        .card-scene{perspective:1200px;width:100%;}
        .card-float{animation:cardFloat 5s ease-in-out infinite;will-change:transform}
        @keyframes cardFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .card-tilt{position:relative;width:100%;aspect-ratio:1.58/1;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.22,1,.36,1);will-change:transform}
        .card-inner-wrap{width:100%;height:100%;position:relative;transform-style:preserve-3d}
        .card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.77,0,.175,1);cursor:pointer;will-change:transform}
        .card-face{position:absolute;inset:0;background:var(--white);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);backface-visibility:hidden;overflow:hidden;padding:26px 26px 20px;display:flex;flex-direction:column;justify-content:space-between}
        .card-face.back{transform:rotateY(180deg);background:radial-gradient(120% 140% at 90% -10%,rgba(183,154,109,.18),transparent 50%), var(--white)}
        .card-top{display:flex;justify-content:space-between;align-items:flex-start}
        .card-logo{font:800 12px/1 'Manrope';letter-spacing:.18em}
        .card-chip{width:34px;height:26px;border-radius:6px;background:linear-gradient(135deg,#d8c8a8,#b79a6d);border:1px solid rgba(0,0,0,.08)}
        .card-name{font:800 38px/0.9 'Manrope';letter-spacing:-.05em;margin:14px 0 8px}
        .card-role{font:700 10px/1.3 'DM Sans';letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
        .card-tagline{margin-top:16px;font:600 11px/1.4 'Manrope';letter-spacing:.08em;color:var(--wine)}
        .card-foot{display:flex;justify-content:space-between;align-items:end;margin-top:18px}
        .card-foot span{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
        .card-back-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
        .card-back-item{border-top:1px solid var(--line);padding-top:10px}
        .card-back-item b{display:block;font:700 9px/1 'DM Sans';letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
        .card-back-item div{font:600 13px/1.3 'DM Sans';word-break:break-all}
        .card-back-qr{width:64px;height:64px;border-radius:12px;background:repeating-linear-gradient(0deg,#24211e 0 3px,transparent 3px 6px),repeating-linear-gradient(90deg,#24211e 0 3px,transparent 3px 6px);opacity:.85}
        .card-shadow{position:absolute;left:6%;right:6%;bottom:-18px;height:30px;background:radial-gradient(ellipse at center,rgba(36,33,30,.22),transparent 70%);filter:blur(12px);pointer-events:none;will-change:transform,opacity;transition:opacity .8s}
        .card-label{margin-top:18px;text-align:center;font:700 9px/1 'DM Sans';letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

        /* ── QUOTE + INTRO GRID GỐC ── */
        .quote{padding:100px 0;position:relative;z-index:2}
        .quote p{max-width:1000px;margin:0;font:500 clamp(26px,4vw,60px)/1.12 'Playfair Display';letter-spacing:-.025em}
        .quote p:before{content:'“';color:var(--wine);font-size:1.4em;vertical-align:-.2em;margin-right:8px}
        .quote .attr{margin-top:26px;margin-left:12px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
        .intro-grid{display:grid;grid-template-columns:220px 1fr;gap:7vw}
        .sticky{position:sticky;top:110px;height:max-content}
        .chapter{font:800 clamp(22px,2.6vw,38px)/.95 'Manrope';letter-spacing:-.045em;text-transform:uppercase}
        .story{max-width:800px}
        .story h2{font:700 clamp(26px,3.2vw,48px)/1.05 'Manrope';letter-spacing:-.045em;margin:0 0 32px}
        .story p{font-size:15px;line-height:1.9;color:#514c46;margin:0 0 22px}
        .story p strong{color:var(--ink)}
        .pull{margin:46px 0;padding:28px 0 28px 24px;border-left:2px solid var(--wine);font:500 22px/1.3 'Playfair Display';color:var(--wine)}
        .media-row{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin:60px 0}
        .frame{position:relative;min-height:380px;border-radius:26px;overflow:hidden;background:linear-gradient(135deg,#d8d0c2,#b5a696);box-shadow:var(--shadow);cursor:pointer;will-change:transform}
        .frame.tall{min-height:520px}
        .frame:after{content:"ADD IMAGE";position:absolute;left:20px;bottom:18px;font-size:8px;letter-spacing:.18em;color:rgba(36,33,30,.5)}
        .frame .cap{position:absolute;top:16px;left:16px;padding:6px 9px;border:1px solid rgba(255,255,255,.55);border-radius:999px;color:white;background:rgba(36,33,30,.18);backdrop-filter:blur(8px);font-size:8px;letter-spacing:.13em;text-transform:uppercase;z-index:2}
        .timeline{position:relative;margin-top:60px}
        .timeline:before{content:"";position:absolute;left:84px;top:0;bottom:0;width:1px;background:var(--line)}
        .tl{display:grid;grid-template-columns:130px 1fr;gap:40px;padding:0 0 70px}
        .tl-year{font:700 11px/1 'DM Sans';letter-spacing:.16em;color:var(--muted);padding-top:6px}
        .tl h3{font:800 24px/1.05 'Manrope';letter-spacing:-.03em;margin:0 0 12px}
        .tl p{max-width:720px;margin:0;color:#514c46;font-size:14px;line-height:1.85}
        .tag{display:inline-block;margin-top:14px;border:1px solid var(--line);padding:5px 9px;border-radius:999px;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
        .work-head{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:60px}
        .work-head h2{margin:12px 0 0;font:800 clamp(38px,5.6vw,76px)/.9 'Manrope';letter-spacing:-.065em}
        .work-note{max-width:380px;color:var(--muted);font-size:14px;line-height:1.7}
        .capabilities{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
        .cap{padding:30px 24px 34px;border-right:1px solid var(--line);min-height:240px}
        .cap:last-child{border-right:0}
        .cap-num{font-size:10px;color:var(--champ);letter-spacing:.15em}
        .cap h3{font:800 16px/1.1 'Manrope';margin:20px 0 10px}
        .cap p{font-size:13px;line-height:1.7;color:var(--muted);margin:0}
        .darkband{background:var(--ink);color:var(--white);margin-top:0;position:relative;overflow:hidden}
        .darkband:before{content:"";position:absolute;width:600px;height:600px;border-radius:50%;right:-220px;top:-260px;background:radial-gradient(circle,rgba(183,154,109,.20),transparent 68%)}
        .darkband .story p{color:rgba(251,249,244,.68)}
        .darkband .chapter{color:var(--champ)}
        .darkband .pull{color:#ead9bb;border-color:var(--champ)}
        .project-intro{display:grid;grid-template-columns:1fr .65fr;gap:6vw;margin-bottom:60px}
        .project-intro h2{margin:12px 0 0;font:800 clamp(40px,5.6vw,84px)/.86 'Manrope';letter-spacing:-.07em}
        .project-intro p{color:var(--muted);line-height:1.8;font-size:14px}
        .rail-wrap{position:relative}
        .rail{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;padding:10px 0 32px;cursor:grab;user-select:none;scroll-snap-type:x proximity}
        .rail::-webkit-scrollbar{display:none}
        .project-card{flex:0 0 min(440px,76vw);background:var(--white);border:1px solid var(--line);border-radius:28px;overflow:hidden;transition:transform .9s var(--ease),box-shadow .9s var(--ease);scroll-snap-align:start}
        .project-card:hover{transform:translateY(-8px);box-shadow:var(--shadow)}
        .project-image{height:280px;background:linear-gradient(135deg,#d5cec1,#a99683);position:relative;overflow:hidden}
        .project-body{padding:24px 24px 26px}
        .project-no{font-size:9px;letter-spacing:.18em;color:var(--champ)}
        .project-body h3{font:800 22px/1.05 'Manrope';letter-spacing:-.03em;margin:12px 0}
        .project-body p{font-size:13px;line-height:1.7;color:var(--muted);margin:0}
        .project-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}
        .project-meta span{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:8px;letter-spacing:.1em;color:var(--muted)}
        .rail-hint{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
        .rail-bar{height:2px;background:var(--line);position:relative}
        .rail-progress{height:2px;width:18%;background:var(--wine);transition:width .18s linear;will-change:width}
        .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:70px}
        .metric{padding:26px;border:1px solid var(--line);border-radius:24px;min-height:180px}
        .metric.accent{background:var(--wine);color:var(--white);border-color:var(--wine)}
        .metric .eyebrow{color:inherit;opacity:.6}
        .metric p{font-size:13px;line-height:1.7;margin:16px 0 0;color:inherit;opacity:.78}
        .process{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:70px}
        .process-card{border:1px solid var(--line);border-radius:26px;padding:30px;background:rgba(255,255,255,.25)}
        .process-card h3{font:800 22px/1 'Manrope';margin:0 0 22px}
        .process-list{display:grid;gap:16px}
        .process-item{display:grid;grid-template-columns:36px 1fr;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line)}
        .process-item:last-child{border:0;padding-bottom:0}
        .process-item b{font:800 12px/1 'Manrope';color:var(--wine)}
        .process-item strong{display:block;font-size:13px;margin-bottom:3px}
        .process-item span{font-size:12px;color:var(--muted);line-height:1.6}
        .final{min-height:76vh;display:grid;place-items:center;text-align:center;padding:120px 0;position:relative;z-index:2}
        .final h2{font:800 clamp(46px,8vw,120px)/.82 'Manrope';letter-spacing:-.075em;margin:0}
        .final h2 em{font-family:'Playfair Display';font-weight:500;color:var(--wine)}
        .final p{max-width:620px;margin:34px auto 0;color:var(--muted);font-size:15px;line-height:1.8}
        .contact{display:inline-flex;margin-top:36px;border:1px solid var(--ink);padding:13px 20px;border-radius:999px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;transition:background .6s var(--ease),color .6s var(--ease),transform .6s var(--ease);will-change:transform}
        .contact:hover{background:var(--ink);color:var(--white)}
        footer{padding:32px 0;border-top:1px solid var(--line);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:18px;position:relative;z-index:2}
        .reveal{opacity:0;transform:translateY(28px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease);will-change:transform,opacity}
        .reveal.in{opacity:1;transform:none}
        .slow{transition-duration:1.6s}
        .delay1{transition-delay:.1s}.delay2{transition-delay:.2s}
        .word{display:inline-block;overflow:hidden}
        .word span{display:inline-block;transform:translateY(110%);transition:transform 1.2s var(--ease)}
        .hero.ready .word span{transform:none}
        .marquee{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;padding:13px 0;color:var(--muted);font-size:10px;letter-spacing:.2em;text-transform:uppercase;position:relative;z-index:2}
        .marquee-track{display:inline-block;animation:marquee 38s linear infinite;will-change:transform}
        @keyframes marquee{to{transform:translateX(-50%)}}

        /* ── DRAWER MENU TRANG CON ── BRIEF:
           - Drawer width 420px, trượt từ phải, overlay blur
           - TRANG CON: 5 link #nhat-ky #du-an #ve-toi #kho-anh #viet
           - MỤC LỤC: 01-08 link tới section gốc
           - Sửa: thêm bớt link trong JSX DRAWER MENU
        */
        .drawer-overlay{position:fixed;inset:0;background:rgba(36,33,30,.42);backdrop-filter:blur(10px);z-index:100;opacity:0;pointer-events:none;transition:opacity .6s var(--ease)}
        .drawer-overlay.open{opacity:1;pointer-events:auto}
        .drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--paper);z-index:101;transform:translateX(100%);transition:transform .8s cubic-bezier(.77,0,.175,1);display:flex;flex-direction:column;box-shadow:-30px 0 80px rgba(0,0,0,.12);border-left:1px solid var(--line)}
        .drawer.open{transform:translateX(0)}
        .drawer-head{display:flex;justify-content:space-between;align-items:center;padding:22px 28px;border-bottom:1px solid var(--line)}
        .drawer-head b{font:800 11px/1 'Manrope';letter-spacing:.18em}
        .drawer-close{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--white);display:grid;place-items:center;cursor:pointer}
        .drawer-body{overflow:auto;padding:26px 28px 28px;flex:1;display:grid;gap:36px;align-content:start}
        .drawer-section b{display:block;font:700 10px/1 'DM Sans';letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
        .drawer-links{display:grid;gap:10px}
        .drawer-links a{font:600 18px/1.1 'Manrope';letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.55);transition:.4s var(--ease)}
        .drawer-links a:hover{background:var(--white);transform:translateY(-1px);border-color:rgba(36,33,30,.22)}
        .drawer-links a span:last-child{font:700 10px/1 'DM Sans';color:var(--muted)}
        .drawer-toc{display:grid;gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--white)}
        .drawer-toc a{display:grid;grid-template-columns:42px 1fr 18px;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;transition:background .3s}
        .drawer-toc a:last-child{border-bottom:0}
        .drawer-toc a:hover{background:var(--paper2)}
        .drawer-toc a i{font:700 10px/1 'DM Sans';color:var(--champ)}
        .drawer-foot{padding:20px 28px;border-top:1px solid var(--line);display:grid;gap:10px}
        .drawer-foot .small{font-size:11px}
        @media(max-width:900px){
          .wrap{padding:0 6vw}
          .hero-grid,.intro-grid,.media-row,.project-intro,.process{grid-template-columns:1fr}
          .hero{padding-top:124px;min-height:auto}
          .hero-intro{margin:44px 0 0}
          .card-sticky{position:relative;top:auto;margin-top:38px}
          .section{padding:90px 0}
          .capabilities,.metrics{grid-template-columns:1fr 1fr}
          .cap:nth-child(2){border-right:0}.cap:nth-child(3){border-top:1px solid var(--line)}.cap:nth-child(4){border-top:1px solid var(--line);border-right:0}
          .sticky{position:relative;top:auto;margin-bottom:36px}
          .timeline:before{display:none}.tl{grid-template-columns:70px 1fr;gap:18px}
          .media-row{gap:12px}.frame,.frame.tall{min-height:360px}.work-head{display:block}.work-note{margin-top:24px}.metrics{margin-top:48px}.final{min-height:60vh}
        }
        @media(max-width:560px){

          .project-image{height:230px}.project-card{flex-basis:84vw}.display{font-size:52px}.hero h1{font-size:50px}.tl{grid-template-columns:1fr}.tl-year{padding-top:0}.frame{min-height:280px}.frame.tall{min-height:360px}footer{display:block}footer span{display:block;margin-top:6px}
          .drawer{width:100%;max-width:100%}
